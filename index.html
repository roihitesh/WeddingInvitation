<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5e0a14" />
    <meta name="description" content="A traditional Hindu wedding invitation." />
    <meta property="og:title" content="A Wedding Invitation" />
    <meta property="og:image" content="assets/images/og-preview.svg" />
    <title>A Wedding Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+Devanagari:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/themes.css" />
    <link rel="stylesheet" href="assets/css/typography.css" />
    <link rel="stylesheet" href="assets/css/envelope.css" />
    <link rel="stylesheet" href="assets/css/language-gate.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/creative.css" />
    <link rel="preload" href="assets/audio/ganesha-intro.mp3" as="audio" type="audio/mpeg" />
    <script type="module" src="assets/js/core/app.js?v=20261015-cover-audio"></script>
  </head>
  <body>
    <canvas id="ambient-canvas" class="ambient-canvas" aria-hidden="true"></canvas>
    <div class="sample-banner" data-i18n="sample"></div>

    <section class="entry-gate" id="entry-gate" aria-labelledby="entry-title">
      <div class="entry-card patrika-card">
        <!-- 4 Authentic Patrika Golden Filigree Corners -->
        <div class="patrika-corner patrika-corner-tl" aria-hidden="true">
          <svg viewBox="0 0 44 44"><path d="M4 4 h36 M4 4 v36 M4 4 L22 22 M12 4 C12 16 16 20 26 20 M4 12 C16 12 20 16 20 26" fill="none" stroke="url(#entryGold)" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div class="patrika-corner patrika-corner-tr" aria-hidden="true">
          <svg viewBox="0 0 44 44"><path d="M40 4 h-36 M40 4 v36 M40 4 L22 22 M32 4 C32 16 28 20 18 20 M40 12 C28 12 24 16 24 26" fill="none" stroke="url(#entryGold)" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div class="patrika-corner patrika-corner-bl" aria-hidden="true">
          <svg viewBox="0 0 44 44"><path d="M4 40 h36 M4 40 v-36 M4 40 L22 22 M12 40 C12 28 16 24 26 24 M4 32 C16 32 20 28 20 18" fill="none" stroke="url(#entryGold)" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div class="patrika-corner patrika-corner-br" aria-hidden="true">
          <svg viewBox="0 0 44 44"><path d="M40 40 h-36 M40 40 v-36 M40 40 L22 22 M32 40 C32 28 28 24 18 24 M40 32 C28 32 24 28 24 18" fill="none" stroke="url(#entryGold)" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>

        <div class="patrika-top-motif">
          <span class="patrika-top-flourish" aria-hidden="true">꧁</span>
          <span class="entry-mantra" id="entry-mantra">॥ ॐ श्री गणेशाय नमः ॥</span>
          <span class="patrika-top-flourish" aria-hidden="true">꧂</span>
        </div>

        <!-- Royal Hindu Wedding Monogram Logo Crest -->
        <svg xmlns="http://www.w3.org/2000/svg" class="ganesha-mark" viewBox="0 0 200 200" role="img" aria-label="Shivanee and Hitesh royal wedding monogram crest">
          <defs>
            <linearGradient id="entryGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#bf953f"/>
              <stop offset="30%" stop-color="#fdf1cb"/>
              <stop offset="65%" stop-color="#d4af37"/>
              <stop offset="100%" stop-color="#9b6f1e"/>
            </linearGradient>
            <linearGradient id="bannerGold" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#8b6014"/>
              <stop offset="20%" stop-color="#d4af37"/>
              <stop offset="50%" stop-color="#fff1c2"/>
              <stop offset="80%" stop-color="#d4af37"/>
              <stop offset="100%" stop-color="#8b6014"/>
            </linearGradient>
            <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#e5c158" flood-opacity="0.6"/>
            </filter>
          </defs>

          <!-- Pinnacle Kalash & Sacred Coconut -->
          <path class="crest-pinnacle" d="M100 6 C98 6 97 9 98 13 L100 17 L102 13 C103 9 102 6 100 6 Z" fill="url(#entryGold)"/>
          <circle cx="100" cy="22" r="6" fill="url(#entryGold)"/>
          <path d="M88 26 C92 21 100 21 100 26 C100 21 108 21 112 26 C106 28 94 28 88 26 Z" fill="url(#entryGold)"/>
          <path d="M92 28 H108 L106 35 C105 38 103 40 100 40 C97 40 95 38 94 35 Z" fill="url(#entryGold)"/>

          <!-- Ornate Royal Temple Arch (Jharokha Mehraab) -->
          <path class="crest-arch-outer" d="M34 154 V92 C34 52 64 36 100 36 C136 36 166 52 166 92 V154" fill="none" stroke="url(#entryGold)" stroke-width="1.8" stroke-linecap="round"/>
          <path class="crest-arch-inner" d="M42 154 V94 C42 60 68 44 100 44 C132 44 158 60 158 94 V154" fill="none" stroke="url(#entryGold)" stroke-width="1" stroke-dasharray="3 3"/>
          <path class="crest-scallops" d="M48 148 C48 88 70 54 100 54 C130 54 152 88 152 148" fill="none" stroke="url(#entryGold)" stroke-width="1.2"/>

          <!-- Sacred Om Blessing -->
          <text class="crest-om" x="100" y="73" text-anchor="middle" fill="url(#entryGold)">ॐ</text>

          <!-- Couple Monogram Calligraphy -->
          <g class="crest-monogram" filter="url(#goldGlow)">
            <text class="crest-letter crest-letter-bride" id="crest-initial-bride" x="76" y="116" text-anchor="middle" fill="url(#entryGold)">S</text>
            <text class="crest-ampersand" x="100" y="112" text-anchor="middle" fill="url(#entryGold)">&amp;</text>
            <text class="crest-letter crest-letter-groom" id="crest-initial-groom" x="124" y="116" text-anchor="middle" fill="url(#entryGold)">H</text>
          </g>

          <!-- Ornate Royal Ribbon / Scroll -->
          <path class="crest-ribbon-shadow" d="M38 155 L48 165 L48 158 Z M162 155 L152 165 L152 158 Z" fill="#5c3d0b"/>
          <path class="crest-ribbon-tails" d="M32 164 L46 155 L46 168 L32 174 L37 169 Z M168 164 L154 155 L154 168 L168 174 L163 169 Z" fill="url(#entryGold)"/>
          <path class="crest-ribbon-body" d="M44 154 Q100 166 156 154 L154 171 Q100 183 46 171 Z" fill="url(#bannerGold)" stroke="#9b6f1e" stroke-width="0.8" filter="url(#goldGlow)"/>
          
          <text class="crest-banner-text" x="100" y="166" text-anchor="middle" fill="#4a0e15">॥ शुभ विवाह ॥</text>
        </svg>

        <p class="entry-eyebrow" data-i18n="entryEyebrow"></p>
        <h1 id="entry-title" class="entry-title" data-i18n-html="entryTitle"></h1>
        <div class="patrika-names-wrap">
          <p class="entry-names" id="entry-names"></p>
        </div>
        <div class="patrika-date-seal">
          <span class="patrika-seal-icon" aria-hidden="true">✦</span>
          <p class="entry-date" id="entry-date"></p>
          <span class="patrika-seal-icon" aria-hidden="true">✦</span>
        </div>
        <p class="entry-welcome" data-i18n="entryWelcome"></p>

        <!-- Creative Language Selection Section -->
        <div class="patrika-language-dialog">
          <div class="patrika-dialog-header">
            <span class="patrika-dialog-ornament" aria-hidden="true">✤</span>
            <p class="entry-language-heading" id="language-prompt" data-i18n="chooseLanguage"></p>
            <span class="patrika-dialog-ornament" aria-hidden="true">✤</span>
          </div>
          <div class="language-choice" role="radiogroup" aria-labelledby="language-prompt" id="language-choice"></div>
        </div>

        <button class="button button-gold entry-enter-btn" id="enter-invitation" type="button">
          <span class="btn-sacred-icon" aria-hidden="true">🪷</span>
          <span data-i18n="enter"></span>
          <span class="btn-arrow" aria-hidden="true">↗</span>
        </button>
      </div>
    </section>

    <section class="patrika-screen" id="patrika-screen" aria-label="Wedding invitation envelope" hidden>
      <div class="patrika-copy">
        <p class="eyebrow" data-i18n="opening"></p>
        <div class="patrika" id="patrika">
          <div class="patrika-card" aria-hidden="true"><span class="card-om">ॐ</span><span class="card-vine">❋</span><span class="card-vine">❋</span></div>
          <div class="patrika-flap"></div>
          <button class="tilak-seal" id="open-patrika" type="button" aria-label="Open the Lagan Patrika"><span class="seal-ring">ॐ</span></button>
        </div>
        <p class="patrika-hint" data-i18n="sealHint"></p>
      </div>
    </section>

    <canvas class="petal-canvas" id="petal-canvas" aria-hidden="true"></canvas>

    <header class="sacred-header" id="site-header" hidden>
      <a class="header-mark" href="#top" aria-label="Back to invitation">ॐ</a>
      <nav aria-label="Invitation navigation">
        <a href="#hero" data-i18n="navStory"></a>
        <a href="#events" data-i18n="navEvents"></a>
        <a href="#gallery" data-i18n="navGallery"></a>
        <a href="#rsvp" data-i18n="navRsvp"></a>
      </nav>
      <span class="header-ornament" aria-hidden="true">✽</span>
    </header>

    <main id="invitation" hidden>
      <section class="sacred-opening" id="top">
        <div class="sacred-motif" aria-hidden="true">ॐ</div>
        <p class="invoking-mantra reveal-on-scroll" id="invoking-mantra"></p>
        <blockquote class="sanskrit-shloka reveal-on-scroll" id="sanskrit-shloka"></blockquote>
        <p class="meaning-badge" id="shloka-meaning"></p>
      </section>

      <section class="hero-section" id="hero">
        <div class="hero-ornament hero-ornament-left" aria-hidden="true">❋</div>
        <p class="eyebrow" data-i18n="heroEyebrow"></p>
        <div class="lineage-block" id="lineage"></div>
        <h1 class="couple-names"><span id="bride-name"></span><i aria-hidden="true">&amp;</i><span id="groom-name"></span></h1>
        <p class="invitation-line" data-i18n="invitationLine"></p>
        <p class="tithi"><span data-i18n="tithiLabel"></span> <strong id="auspicious-tithi"></strong></p>
        <div class="muhurat-block">
          <p class="eyebrow" data-i18n="countdownTitle"></p>
          <div class="countdown" id="countdown" aria-live="polite"></div>
          <p class="muhurat-date" id="muhurat-date"></p>
        </div>
        <div class="hero-ornament hero-ornament-right" aria-hidden="true">❋</div>
      </section>

      <div class="toran-divider" aria-hidden="true"><svg viewBox="0 0 1200 70" preserveAspectRatio="none"><path class="toran-line" d="M0 8Q300 8 600 18t600-10M0 12v12m50-12v9m50-9v12m1050-12v12m50-12v9m50-9v12"/><g class="toran-leaves"><path d="M70 15q-15 23 0 32 15-9 0-32m60-2q-14 22 0 31 14-9 0-31m60 1q-13 21 0 29 13-8 0-29m820 0q-13 21 0 29 13-8 0-29m60-1q-14 22 0 31 14-9 0-31m60 2q-15 23 0 32 15-9 0-32"/><path d="M600 18Q570 43 600 62q30-19 0-44m-65 0q-25 22 0 40 25-18 0-40m130 0q-25 22 0 40 25-18 0-40"/></g></svg></div>
      <section class="events-section section-shell" id="events">
        <div class="section-heading reveal-on-scroll"><p class="eyebrow" data-i18n="eventsEyebrow"></p><h2 data-i18n="eventsTitle"></h2><p data-i18n="eventsIntro"></p></div>
        <div class="event-grid" id="event-grid"></div>
      </section>

      <div class="toran-divider" aria-hidden="true"><svg viewBox="0 0 1200 70" preserveAspectRatio="none"><path class="toran-line" d="M0 8Q300 8 600 18t600-10M0 12v12m50-12v9m50-9v12m1050-12v12m50-12v9m50-9v12"/><g class="toran-leaves"><path d="M70 15q-15 23 0 32 15-9 0-32m60-2q-14 22 0 31 14-9 0-31m60 1q-13 21 0 29 13-8 0-29m820 0q-13 21 0 29 13-8 0-29m60-1q-14 22 0 31 14-9 0-31m60 2q-15 23 0 32 15-9 0-32"/><path d="M600 18Q570 43 600 62q30-19 0-44m-65 0q-25 22 0 40 25-18 0-40m130 0q-25 22 0 40 25-18 0-40"/></g></svg></div>
      <section class="gallery-section section-shell" id="gallery">
        <div class="section-heading reveal-on-scroll"><p class="eyebrow" data-i18n="galleryEyebrow"></p><h2 data-i18n="galleryTitle"></h2><p data-i18n="galleryIntro"></p></div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </section>

      <div class="toran-divider" aria-hidden="true"><svg viewBox="0 0 1200 70" preserveAspectRatio="none"><path class="toran-line" d="M0 8Q300 8 600 18t600-10M0 12v12m50-12v9m50-9v12m1050-12v12m50-12v9m50-9v12"/><g class="toran-leaves"><path d="M70 15q-15 23 0 32 15-9 0-32m60-2q-14 22 0 31 14-9 0-31m60 1q-13 21 0 29 13-8 0-29m820 0q-13 21 0 29 13-8 0-29m60-1q-14 22 0 31 14-9 0-31m60 2q-15 23 0 32 15-9 0-32"/><path d="M600 18Q570 43 600 62q30-19 0-44m-65 0q-25 22 0 40 25-18 0-40m130 0q-25 22 0 40 25-18 0-40"/></g></svg></div>
      <section class="rsvp-section section-shell" id="rsvp">
        <div class="section-heading reveal-on-scroll"><p class="eyebrow" data-i18n="rsvpEyebrow"></p><h2 data-i18n="rsvpTitle"></h2><p><span data-i18n="rsvpIntro"></span> <strong id="rsvp-deadline"></strong></p></div>
        
        <form class="rsvp-form" id="rsvp-form">
          <!-- Section 1: Guest Details -->
          <div class="rsvp-section-card">
            <div class="rsvp-card-header">
              <span class="rsvp-section-num">1</span>
              <span class="rsvp-section-title" data-i18n="stepGuests"></span>
            </div>
            <label for="guest-name" data-i18n="guestName"></label>
            <input id="guest-name" name="guestName" autocomplete="name" required data-i18n-placeholder="guestNamePlaceholder" />
            <label for="guest-count" data-i18n="guests"></label>
            <div class="guest-pills" id="guest-pills" role="radiogroup" aria-labelledby="guest-count">
              <button type="button" class="guest-pill is-active" data-count="1">1</button>
              <button type="button" class="guest-pill" data-count="2">2</button>
              <button type="button" class="guest-pill" data-count="3">3</button>
              <button type="button" class="guest-pill" data-count="4">4</button>
              <button type="button" class="guest-pill" data-count="5">5</button>
              <button type="button" class="guest-pill" data-count="6">6+</button>
            </div>
            <select id="guest-count" name="guestCount" class="visually-hidden">
              <option value="1" selected>1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </div>

          <!-- Section 2: Ceremonies -->
          <div class="rsvp-section-card">
            <div class="rsvp-card-header">
              <span class="rsvp-section-num">2</span>
              <span class="rsvp-section-title" data-i18n="stepEvents"></span>
              <button type="button" class="quick-select-all" id="quick-select-all"><span class="check-icon">✓</span> <span data-i18n="selectAllEvents"></span></button>
            </div>
            <fieldset class="rsvp-fieldset"><div class="event-checkboxes" id="event-checkboxes"></div></fieldset>
          </div>

          <!-- Section 3: Blessings & Feast -->
          <div class="rsvp-section-card">
            <div class="rsvp-card-header">
              <span class="rsvp-section-num">3</span>
              <span class="rsvp-section-title" data-i18n="stepBlessings"></span>
            </div>
            <label for="dietary-choice" data-i18n="dietary"></label>
            <select id="dietary-choice" name="dietaryChoice">
              <option value="jain" data-i18n="dietaryJain"></option>
              <option value="sattvic" data-i18n="dietarySattvic"></option>
              <option value="north-indian" data-i18n="dietaryNorth"></option>
              <option value="south-indian" data-i18n="dietarySouth"></option>
            </select>
            <label for="blessing-message" data-i18n="blessing"></label>
            <textarea id="blessing-message" name="blessing" rows="3" maxlength="600" data-i18n-placeholder="blessingPlaceholder"></textarea>
          </div>

          <button class="button button-maroon rsvp-submit-btn" id="rsvp-submit" type="submit"><span data-i18n="submit"></span><span aria-hidden="true">↗</span></button>
          <p class="rsvp-preview" id="rsvp-preview" data-i18n="preview"></p>
        </form>

        <div class="rsvp-celebration" id="rsvp-celebration" hidden>
          <span class="celebration-icon" aria-hidden="true">🌺</span>
          <h3 data-i18n="celebrationTitle"></h3>
          <p data-i18n="celebrationText"></p>
        </div>
      </section>

      <footer class="sacred-footer"><p class="footer-names"></p><p data-i18n="footer"></p><span aria-hidden="true">ॐ</span></footer>
    </main>

    <aside class="floating-controls" id="floating-controls" aria-label="Invitation controls" hidden>
      <div class="floating-languages" role="group" aria-label="Language" id="floating-languages"></div>
      <button class="control-audio" id="audio-toggle" type="button" aria-pressed="false" aria-label="Toggle ambient sound"><span aria-hidden="true">♫</span></button>
      <a class="button button-gold control-rsvp" href="#rsvp"><span data-i18n="jumpRsvp"></span><span aria-hidden="true">↑</span></a>
    </aside>

    <dialog class="ceremony-dialog" id="ceremony-dialog" aria-labelledby="ceremony-dialog-title">
      <button type="button" class="ceremony-dialog-close" id="ceremony-dialog-close" data-i18n="closeDetails" aria-label="Close details">×</button>
      <p class="eyebrow" data-i18n="detailsTitle"></p>
      <h2 id="ceremony-dialog-title"></h2>
      <p class="ceremony-dialog-date" id="ceremony-dialog-date"></p>
      <p class="ceremony-dialog-description" id="ceremony-dialog-description"></p>
      <p class="ceremony-dialog-detail" id="ceremony-dialog-venue"></p>
      <p class="ceremony-dialog-detail" id="ceremony-dialog-attire"></p>
      <a class="button button-gold" id="ceremony-dialog-map" href="#" target="_blank" rel="noopener noreferrer"></a>
    </dialog>

    <dialog class="lightbox" id="lightbox" aria-label="Photo gallery">
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
      <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">‹</button>
      <figure><img id="lightbox-image" alt="" /><figcaption id="lightbox-caption"></figcaption></figure>
      <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">›</button>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <canvas class="confetti-canvas" id="confetti-canvas" aria-hidden="true"></canvas>
  </body>
</html>
