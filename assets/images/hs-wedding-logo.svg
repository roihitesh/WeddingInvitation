<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Hitesh and Shivanee Royal Wedding Monogram">
  <defs>
    <linearGradient id="hsGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b88728" />
      <stop offset="25%" stop-color="#fcedb3" />
      <stop offset="50%" stop-color="#e5c065" />
      <stop offset="75%" stop-color="#fef3cc" />
      <stop offset="100%" stop-color="#9a6c18" />
    </linearGradient>
    <linearGradient id="hsLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#839768" />
      <stop offset="50%" stop-color="#c9ad5c" />
      <stop offset="100%" stop-color="#6a824e" />
    </linearGradient>
    <filter id="hsGoldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b88728" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Gold Ring -->
  <circle cx="120" cy="92" r="62" fill="none" stroke="url(#hsGoldGrad)" stroke-width="1.8" filter="url(#hsGoldGlow)" />

  <!-- Botanical Olive / Jasmine Leaf Branch Hugging the Lower-Left Arc -->
  <g class="hs-botanical-branch" stroke="url(#hsLeafGrad)" fill="url(#hsLeafGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main curving vine -->
    <path d="M60 88 C56 112 70 140 106 152 C118 156 130 155 142 150" fill="none" stroke-width="1.6" />
    <!-- Leaf pairs & florets -->
    <path d="M57 96 C48 94 45 87 48 83 C54 84 57 89 57 96 Z" />
    <path d="M54 108 C44 109 40 102 43 97 C49 98 53 103 54 108 Z" />
    <path d="M58 120 C50 124 45 119 46 113 C52 113 56 117 58 120 Z" />
    <path d="M68 132 C58 138 54 133 55 127 C61 126 66 129 68 132 Z" />
    <path d="M79 143 C72 151 66 148 66 141 C71 139 76 141 79 143 Z" />
    <path d="M96 151 C90 160 84 158 83 151 C89 148 94 149 96 151 Z" />
    <path d="M115 156 C112 165 105 165 103 158 C108 154 113 154 115 156 Z" />
    <path d="M132 153 C134 162 128 165 124 159 C126 154 130 152 132 153 Z" />
    <!-- Inward facing leaves -->
    <path d="M66 102 C70 96 76 98 77 104 C72 106 68 104 66 102 Z" />
    <path d="M72 116 C77 111 83 113 84 119 C79 120 75 119 72 116 Z" />
    <path d="M84 130 C90 126 95 129 95 135 C90 135 86 133 84 130 Z" />
    <path d="M102 140 C108 137 113 140 113 146 C107 146 104 143 102 140 Z" />
  </g>

  <!-- Intertwined Monogram Initials H & S -->
  <g class="hs-monogram" filter="url(#hsGoldGlow)">
    <!-- Serif Letter H -->
    <g class="mono-h" fill="url(#hsGoldGrad)">
      <path d="M86 64 H98 V69 H94 V115 H98 V120 H86 V115 H90 V69 H86 Z" />
      <path d="M93 90 H118 V94 H93 Z" />
      <path d="M114 64 H126 V69 H122 V115 H126 V120 H114 V115 H118 V69 H114 Z" />
    </g>
    <!-- Ampersand -->
    <text x="123" y="98" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="24" font-style="italic" fill="url(#hsGoldGrad)" text-anchor="middle" opacity="0.9">&amp;</text>
    <!-- Serif Letter S Intertwined -->
    <path class="mono-s" d="M148 76 C146 70 141 65 133 65 C124 65 117 71 117 78 C117 86 123 90 131 93 C142 97 148 102 148 110 C148 118 140 123 130 123 C121 123 114 117 112 110 L117 108 C118 114 123 119 130 119 C137 119 143 115 143 109 C143 102 137 98 128 95 C118 91 112 86 112 78 C112 71 119 62 133 62 C141 62 148 67 151 74 Z" fill="url(#hsGoldGrad)" />
  </g>

  <!-- Names and Wedding Celebration Text -->
  <text x="120" y="186" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', serif" font-size="13" font-weight="600" letter-spacing="4.5" fill="url(#hsGoldGrad)">HITESH &amp; SHIVANEE</text>
  <line x1="68" y1="195" x2="172" y2="195" stroke="url(#hsGoldGrad)" stroke-width="0.8" opacity="0.5" />
  <circle cx="120" cy="195" r="2" fill="url(#hsGoldGrad)" />
  <text x="120" y="210" text-anchor="middle" font-family="'Cinzel', 'DM Sans', sans-serif" font-size="8.5" font-weight="500" letter-spacing="3.8" fill="#a07428">WEDDING CELEBRATION</text>
</svg>
